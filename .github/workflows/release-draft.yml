name: Draft Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Required MacDog version label for the generated DMG"
        required: true
      tag:
        description: "Required existing signed Git tag for the draft release"
        required: true
      acknowledge_unsigned:
        description: "Type UNSIGNED-DRAFT to confirm this is not a notarized public stable release"
        required: true

permissions:
  contents: write

jobs:
  draft:
    name: Build unsigned DMG and create draft release
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Check unsigned draft acknowledgement
        env:
          ACKNOWLEDGE_UNSIGNED: ${{ inputs.acknowledge_unsigned }}
        run: |
          if [[ "$ACKNOWLEDGE_UNSIGNED" != "UNSIGNED-DRAFT" ]]; then
            echo "Type UNSIGNED-DRAFT to create an unsigned draft release." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Show Xcode
        run: xcodebuild -version

      - name: Verify
        env:
          MACDOG_RELEASE_VERSION: ${{ inputs.version }}
        run: ./script/check.sh --no-run

      - name: Package DMG
        env:
          MACDOG_RELEASE_VERSION: ${{ inputs.version }}
        run: ./script/package_release.sh --skip-build

      - name: Verify DMG
        run: hdiutil verify "dist/release/MacDog-${{ inputs.version }}.dmg"

      - name: Verify checksum
        working-directory: dist/release
        run: shasum -a 256 -c "MacDog-${{ inputs.version }}.dmg.sha256"

      - name: Verify signed release tag
        env:
          GH_TOKEN: ${{ github.token }}
          MACDOG_VERSION: ${{ inputs.version }}
          MACDOG_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$MACDOG_TAG" != "v$MACDOG_VERSION" ]]; then
            echo "Release tag must equal v<version>. version=$MACDOG_VERSION tag=$MACDOG_TAG" >&2
            exit 1
          fi

          tag_type="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$MACDOG_TAG" --jq '.object.type')"
          tag_object_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$MACDOG_TAG" --jq '.object.sha')"
          if [[ "$tag_type" != "tag" ]]; then
            echo "Release tag must be a signed annotated tag, got object type: $tag_type" >&2
            exit 1
          fi

          target_type="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object_sha" --jq '.object.type')"
          target_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object_sha" --jq '.object.sha')"
          verified="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object_sha" --jq '.verification.verified')"
          reason="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object_sha" --jq '.verification.reason')"

          if [[ "$target_type" != "commit" || "$target_sha" != "$GITHUB_SHA" ]]; then
            echo "Release tag must point at this release head. tag=$target_sha head=$GITHUB_SHA type=$target_type" >&2
            exit 1
          fi

          if [[ "$verified" != "true" ]]; then
            echo "Release tag must be GitHub Verified. reason=$reason" >&2
            exit 1
          fi

      - name: Create draft GitHub Release
        id: create_draft
        env:
          GH_TOKEN: ${{ github.token }}
          MACDOG_VERSION: ${{ inputs.version }}
          MACDOG_TAG: ${{ inputs.tag }}
        run: |
          args=(
            release create "$MACDOG_TAG"
            "dist/release/MacDog-$MACDOG_VERSION.dmg"
            "dist/release/MacDog-$MACDOG_VERSION.dmg.sha256"
            --draft
            --verify-tag
            --title "MacDog $MACDOG_VERSION"
            --notes-file "dist/release/MacDog-$MACDOG_VERSION-release-notes.md"
          )

          draft_url="$(gh "${args[@]}")"
          echo "url=$draft_url" >> "$GITHUB_OUTPUT"

      - name: Verify draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          MACDOG_VERSION: ${{ inputs.version }}
          MACDOG_TAG: ${{ inputs.tag }}
          DRAFT_RELEASE_URL: ${{ steps.create_draft.outputs.url }}
        run: |
          verification_complete=0
          release_id=""
          resolve_created_draft_id() {
            local release_rows candidate_id candidate_url
            release_id=""
            if ! release_rows="$(
              gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
                --jq '.[] | [.id, .html_url] | @tsv'
            )"; then
              return 1
            fi
            while IFS=$'\t' read -r candidate_id candidate_url; do
              if [[ "$candidate_url" == "$DRAFT_RELEASE_URL" ]]; then
                if [[ -n "$release_id" ]]; then
                  return 1
                fi
                release_id="$candidate_id"
              fi
            done <<< "$release_rows"
            [[ -n "$release_id" ]]
          }
          cleanup_unverified_draft() {
            if [[ "$verification_complete" != "1" ]]; then
              if [[ -z "$release_id" ]]; then
                resolve_created_draft_id || true
              fi
              if [[ -n "$release_id" ]]; then
                gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$release_id" || true
              fi
            fi
          }
          trap cleanup_unverified_draft EXIT

          if ! resolve_created_draft_id; then
            echo "Created draft release URL did not resolve to exactly one release ID: $DRAFT_RELEASE_URL" >&2
            exit 1
          fi

          is_draft="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" --jq '.draft')"
          is_prerelease="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" --jq '.prerelease')"
          target_commitish="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" --jq '.target_commitish')"
          tag_name="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" --jq '.tag_name')"
          tag_object_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$MACDOG_TAG" --jq '.object.sha')"
          target_type="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object_sha" --jq '.object.type')"
          target_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object_sha" --jq '.object.sha')"
          asset_names="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" --jq '[.assets[].name] | sort | join(",")')"
          expected_assets="MacDog-$MACDOG_VERSION.dmg,MacDog-$MACDOG_VERSION.dmg.sha256"

          if [[ "$is_draft" != "true" || "$is_prerelease" != "false" ]]; then
            echo "Draft release state mismatch. draft=$is_draft prerelease=$is_prerelease" >&2
            exit 1
          fi
          if [[ "$target_type" != "commit" || "$target_sha" != "$GITHUB_SHA" || "$tag_name" != "$MACDOG_TAG" ]]; then
            echo "Draft release identity mismatch. tag_target=$target_sha head=$GITHUB_SHA type=$target_type tag=$tag_name expected=$MACDOG_TAG" >&2
            exit 1
          fi
          echo "Draft release target_commitish is informational for an existing tag: $target_commitish"
          if [[ "$asset_names" != "$expected_assets" ]]; then
            echo "Draft release assets mismatch. actual=$asset_names expected=$expected_assets" >&2
            exit 1
          fi
          verification_complete=1
